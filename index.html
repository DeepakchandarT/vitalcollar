<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Febfitwellness fitness and wellness support.">
  <title>Febfitwellness</title>
  <style>
    :root{color-scheme:light;--purple:#5b3a91;--teal:#174f48;--paper:#fffdf8;}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper)}
    .view{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .22s ease;}
    .view.is-active{visibility:visible;opacity:1;pointer-events:auto;}
    .mode-switch{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:4px;padding:5px;background:rgba(255,253,248,.96);border:1px solid rgba(29,29,29,.15);border-radius:999px;box-shadow:0 12px 34px rgba(30,20,45,.2);backdrop-filter:blur(14px);font:700 13px/1.1 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
    .mode-option{position:relative;display:flex;align-items:center;justify-content:center;min-width:100px;min-height:42px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:#5b5961;cursor:pointer;transition:background .2s ease,color .2s ease,box-shadow .2s ease;}
    .mode-option[aria-pressed="true"]{color:#fff;box-shadow:0 5px 15px rgba(38,28,53,.2)}
    #fitnessButton[aria-pressed="true"]{background:var(--purple)}
    #wellnessButton[aria-pressed="true"]{background:var(--teal)}
    .mode-option:focus-visible{outline:3px solid #f1b735;outline-offset:2px}
    @media(max-width:480px){.mode-switch{bottom:max(12px,env(safe-area-inset-bottom));}.mode-option{min-width:92px;min-height:40px;padding:0 14px;font-size:12px}}
    @media(prefers-reduced-motion:reduce){.view,.mode-option{transition:none}}
  </style>
</head>
<body>
  <iframe class="view is-active" id="fitnessView" src="fitness1.html" title="Febfitwellness Fitness"></iframe>
  <iframe class="view" id="wellnessView" src="mindfullness1.html" title="Febfitwellness Wellness" aria-hidden="true"></iframe>

  <nav class="mode-switch" aria-label="Choose Fitness or Wellness">
    <button class="mode-option" id="fitnessButton" type="button" aria-pressed="true">Fitness</button>
    <button class="mode-option" id="wellnessButton" type="button" aria-pressed="false">Wellness</button>
  </nav>

  <script>
    (function(){
      const fitnessView=document.getElementById('fitnessView');
      const wellnessView=document.getElementById('wellnessView');
      const fitnessButton=document.getElementById('fitnessButton');
      const wellnessButton=document.getElementById('wellnessButton');
      function show(mode,updateHash){
        const wellness=mode==='wellness';
        fitnessView.classList.toggle('is-active',!wellness);
        wellnessView.classList.toggle('is-active',wellness);
        fitnessView.setAttribute('aria-hidden',wellness?'true':'false');
        wellnessView.setAttribute('aria-hidden',wellness?'false':'true');
        fitnessButton.setAttribute('aria-pressed',wellness?'false':'true');
        wellnessButton.setAttribute('aria-pressed',wellness?'true':'false');
        document.title=wellness?'Febfitwellness — Wellness':'Febfitwellness — Fitness';
        if(updateHash) history.replaceState(null,'','#'+(wellness?'wellness':'fitness'));
      }
      fitnessButton.addEventListener('click',()=>show('fitness',true));
      wellnessButton.addEventListener('click',()=>show('wellness',true));
      window.addEventListener('hashchange',()=>show(location.hash==='#wellness'?'wellness':'fitness',false));
      show(location.hash==='#wellness'?'wellness':'fitness',false);
    })();
  </script>
</body>
</html>
