<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>FebFit Wellness — Choose Your Path</title>
<style>
:root{
  --purple:#6e4fc9; --purple-deep:#3d2a6d; --purple-bg:#efe9fb;
  --teal:#0f9c85; --teal-deep:#043d34; --teal-bg:#e6f9f3;
  --ink:#1b1730; --paper:#fbfaf7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,serif;background:var(--ink);color:var(--ink);touch-action:none;user-select:none}
#stage{position:relative;width:100vw;height:100dvh;overflow:hidden}
#fork{
 position:absolute;inset:0;z-index:20;
 background:linear-gradient(115deg,var(--purple-bg),var(--paper) 50%,var(--teal-bg));
 display:flex;flex-direction:column;align-items:center;
 padding-top:9vh;opacity:1;
}
.fork-top{text-align:center;padding:0 9vw;z-index:5}
.eyebrow{font-family:Arial,sans-serif;font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:#8b7fa8;margin-bottom:.8em}
.title{font-size:clamp(1.6rem,6.4vw,2rem);line-height:1.15;font-weight:500}
.title em{color:var(--purple)}
.hint{margin-top:1em;font-family:Arial,sans-serif;font-size:.72rem;color:#9a8fb4}
.interactive{
 position:relative;z-index:5;width:100%;flex:1;display:flex;align-items:center;
 justify-content:space-between;gap:2vw;padding:0 7vw;cursor:grab;
}
.interactive.grabbing{cursor:grabbing}
.side{width:32%;transition:transform .55s ease,opacity .4s ease}
.left{text-align:left}.right{text-align:right}
.arrow{font-family:Arial,sans-serif;font-weight:700;letter-spacing:.1em;font-size:clamp(.72rem,2.6vw,.92rem)}
.left .arrow{color:var(--purple)}.right .arrow{color:var(--teal)}
.brand{margin-top:.5em;font-size:clamp(1.1rem,6vw,2.35rem);font-weight:600;line-height:1.02;overflow-wrap:anywhere}
.left .brand{color:var(--purple-deep)}.right .brand{color:var(--teal-deep)}
.tags{margin-top:.55em;font-family:Arial,sans-serif;font-size:clamp(.6rem,2vw,.68rem);color:#7a7190}
.gesture{position:relative;width:34vw;max-width:250px;min-width:150px;height:78px;flex:none}
.gesture svg{width:100%;height:100%}
.garrow{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gl{stroke:#cbb9f4}.gr{stroke:#b7ece1}
.hand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px}
.ripple{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;border:1px solid #cbb9f4;animation:ripple 2.8s infinite}
.r2{border-color:#b7ece1;animation-delay:.9s}.r3{animation-delay:1.8s}
@keyframes ripple{0%{transform:scale(.3);opacity:.6}70%{opacity:.12}100%{transform:scale(3.6);opacity:0}}
.bottom{font-family:Arial,sans-serif;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:#9a8fb4;margin-bottom:4vh}
.progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:#0000000d}
.fill{height:100%;width:0;transition:width .1s}
.fill.leftfill{background:var(--purple)}.fill.rightfill{background:var(--teal)}
@media(max-width:430px){.gesture{width:30vw;min-width:118px;height:64px}.side{width:36%}}
</style>
</head>
<body>
<div id="stage">
  <div id="fork">
    <div class="fork-top">
      <div class="eyebrow">choose your path</div>
      <div class="title">Strength <em>or</em> stillness?</div>
      <div class="hint">drag left to move, right to pause</div>
    </div>

    <div class="interactive" id="interactive">
      <div class="side left" id="left">
        <div class="arrow">← MOVE</div>
        <div class="brand">FEBFIT</div>
        <div class="tags">Strength · Mobility · Energy</div>
      </div>

      <div class="gesture" aria-hidden="true">
        <svg viewBox="0 0 220 90" preserveAspectRatio="none">
          <line class="garrow gl" x1="94" y1="45" x2="24" y2="45"/>
          <polyline class="garrow gl" points="36,33 24,45 36,57"/>
          <line class="garrow gr" x1="126" y1="45" x2="196" y2="45"/>
          <polyline class="garrow gr" points="184,33 196,45 184,57"/>
        </svg>
        <div class="ripple"></div><div class="ripple r2"></div><div class="ripple r3"></div>
        <div class="hand">☝</div>
      </div>

      <div class="side right" id="right">
        <div class="arrow">PAUSE →</div>
        <div class="brand">FEBMINDFULNESS</div>
        <div class="tags">Breath · Stillness · Balance</div>
      </div>
    </div>

    <div class="bottom">Swipe to explore</div>
    <div class="progress"><div class="fill" id="fill"></div></div>
  </div>
</div>

<script>
(function(){
  const zone=document.getElementById('interactive');
  const left=document.getElementById('left');
  const right=document.getElementById('right');
  const fill=document.getElementById('fill');
  let dragging=false,startX=0,dx=0,pointerId=null;
  const threshold=.27;

  function visual(x){
    const p=Math.min(Math.abs(x)/(innerWidth*.4),1);
    const t=Math.min(Math.abs(x)/(innerWidth*threshold),1);
    zone.style.transform=`translate3d(${x*.14}px,0,0)`;
    if(x<0){
      left.style.transform=`translate3d(${x*.1}px,0,0) scale(${1+p*.06})`;
      right.style.transform=`translate3d(${p*14}px,${p*10}px,0) scale(${1-p*.22})`;
      right.style.opacity=1-p*.7; left.style.opacity=1;
      fill.className='fill leftfill'; fill.style.width=(t*100)+'%';
    }else if(x>0){
      right.style.transform=`translate3d(${x*.1}px,0,0) scale(${1+p*.06})`;
      left.style.transform=`translate3d(${-p*14}px,${p*10}px,0) scale(${1-p*.22})`;
      left.style.opacity=1-p*.7; right.style.opacity=1;
      fill.className='fill rightfill'; fill.style.width=(t*100)+'%';
    }
  }

  function reset(){
    zone.style.transform='';left.style.transform='';right.style.transform='';
    left.style.opacity='';right.style.opacity='';fill.style.width='0';
  }

  function complete(dir){
    zone.style.transition='transform .45s ease';
    zone.style.transform=`translate3d(${dir*innerWidth*.65}px,0,0)`;
    fill.style.width='100%';
    setTimeout(()=>{
      // REAL PAGE NAVIGATION: these are separate HTML pages on the same Vercel site.
      window.location.href = dir<0 ? 'febfit.html' : 'febmindfulness.html';
    },430);
  }

  zone.addEventListener('pointerdown',e=>{
    dragging=true;pointerId=e.pointerId;startX=e.clientX;dx=0;
    zone.setPointerCapture(pointerId);zone.classList.add('grabbing');
    zone.style.transition='none';
  });
  zone.addEventListener('pointermove',e=>{
    if(!dragging || e.pointerId!==pointerId)return;
    dx=e.clientX-startX;visual(dx);
  });
  zone.addEventListener('pointerup',e=>{
    if(!dragging || e.pointerId!==pointerId)return;
    dragging=false;zone.classList.remove('grabbing');
    if(dx<=-innerWidth*threshold) complete(-1);
    else if(dx>=innerWidth*threshold) complete(1);
    else {zone.style.transition='transform .35s ease';reset();}
  });
  zone.addEventListener('pointercancel',()=>{dragging=false;reset()});
  addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft')complete(-1);
    if(e.key==='ArrowRight')complete(1);
  });
})();
</script>
</body>
</html>
