<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>FebFit Wellness</title>
<style>
  :root{
    --purple-deep:   #3d2a6d;
    --purple:        #6e4fc9;
    --purple-light:  #cbb9f4;
    --purple-bg:     #efe9fb;
    --teal-deep:     #043d34;
    --teal:          #0f9c85;
    --teal-light:    #b7ece1;
    --teal-bg:       #e6f9f3;
    --ink:           #1b1730;
    --paper:         #fbfaf7;
    font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  }

  @font-face{
    font-family: 'Fraunces';
    src: local('Georgia');
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:var(--ink); color:var(--ink);
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  #stage{
    position:relative; width:100vw; height:100vh; height:100dvh;
    overflow:hidden;
  }
  /* ---------------------------------------------------- */
  /* 1. SWIPE CHOICE EXPERIENCE — EDITORIAL SWIPE           */
  /* ---------------------------------------------------- */
  #fork{
    position:absolute; inset:0; z-index:20;
    background:linear-gradient(115deg,var(--purple-bg) 0%,var(--paper) 50%,var(--teal-bg) 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding-top:9vh;
    opacity:0;
    transition:opacity .6s ease;
  }
  #fork.show{opacity:1;}
  #fork:not(.show){ pointer-events:none; }

  .fork-top{
    position:relative; text-align:center; z-index:5;
    padding:0 9vw;
  }
  .fork-eyebrow{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:.66rem; letter-spacing:.32em; text-transform:uppercase;
    color:#8b7fa8; margin-bottom:.8em;
  }
  .fork-title{
    font-size:clamp(1.6rem,6.4vw,2rem); line-height:1.15; font-weight:500;
    color:var(--ink);
    display:inline-block;
    transition: transform .5s cubic-bezier(.2,.9,.25,1);
    will-change: transform;
  }
  .fork-title em{font-style:italic;color:var(--purple);}
  .fork-title .amp{color:var(--teal);font-style:italic;}

  .fork-hint{
    margin-top:1em;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:.72rem;color:#9a8fb4;letter-spacing:.02em;
  }

  /* --- the airy interactive area --- */
  .fork-interactive{
    position:relative; z-index:5;
    width:100%; flex:1;
    display:flex; align-items:center; justify-content:space-between;
    gap:2vw;
    padding:0 7vw;
    touch-action:none; cursor:grab;
    -webkit-user-select:none; user-select:none;
  }
  .fork-interactive.grabbing{ cursor:grabbing; }

  .side{
    position:relative; z-index:2;
    width:32%; flex:0 0 auto;
    transition: transform .55s cubic-bezier(.2,.9,.25,1), opacity .4s ease;
    will-change: transform, opacity;
  }
  .side-left{ text-align:left; }
  .side-right{ text-align:right; }

  .side-arrow{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    font-weight:700; letter-spacing:.1em;
    font-size:clamp(.72rem,2.6vw,.92rem);
    transition: transform .4s cubic-bezier(.2,.9,.25,1), color .3s ease;
    transform-origin:left center;
    display:inline-block;
  }
  .side-right .side-arrow{ transform-origin:right center; }
  .side-left .side-arrow{ color:var(--purple); }
  .side-right .side-arrow{ color:var(--teal); }

  /* idle teaching-demo: sides brighten/dim in sync with the hand's swipe direction */
  .side-left{ animation:sideIdleLeft 5.8s cubic-bezier(.45,0,.2,1) infinite; }
  .side-right{ animation:sideIdleRight 5.8s cubic-bezier(.45,0,.2,1) infinite; }
  .side-left .side-arrow{ animation:arrowIdleLeft 5.8s cubic-bezier(.45,0,.2,1) infinite; }
  .side-right .side-arrow{ animation:arrowIdleRight 5.8s cubic-bezier(.45,0,.2,1) infinite; }
  .fork-interactive.interacting .side-left,
  .fork-interactive.interacting .side-right,
  .fork-interactive.interacting .side-arrow{
    animation:none;
  }
  @keyframes sideIdleLeft{
    0%,8%    { opacity:1;  transform:scale(1); }
    14%,32%  { opacity:1;  transform:scale(1.055); }
    40%,54%  { opacity:1;  transform:scale(1); }
    60%,80%  { opacity:.48; transform:scale(.96); }
    88%,100% { opacity:1;  transform:scale(1); }
  }
  @keyframes sideIdleRight{
    0%,8%    { opacity:1;  transform:scale(1); }
    14%,32%  { opacity:.48; transform:scale(.96); }
    40%,54%  { opacity:1;  transform:scale(1); }
    60%,80%  { opacity:1;  transform:scale(1.055); }
    88%,100% { opacity:1;  transform:scale(1); }
  }
  @keyframes arrowIdleLeft{
    0%,8%   { transform:translateX(0); }
    14%,32% { transform:translateX(-5px); }
    40%,100%{ transform:translateX(0); }
  }
  @keyframes arrowIdleRight{
    0%,54%  { transform:translateX(0); }
    60%,80%{ transform:translateX(5px); }
    88%,100%{ transform:translateX(0); }
  }

  .side-brand{
    margin-top:.5em;
    font-size:clamp(1.1rem,6vw,2.35rem);
    font-weight:600; letter-spacing:-.02em; line-height:1.02;
    overflow-wrap:break-word; word-break:break-word;
  }
  .side-left .side-brand{ color:var(--purple-deep); }
  .side-right .side-brand{ color:var(--teal-deep); }

  .side-tags{
    margin-top:.55em;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:clamp(.6rem,2vw,.68rem); letter-spacing:.04em;
    color:#7a7190; opacity:.85;
  }

  /* ==================================================== */
  /* premium swipe-teaching animation: press → drag →       */
  /* release → return, mirrored left (purple) / right (teal) */
  /* ==================================================== */
  .fork-gesture{
    position:relative; z-index:1;
    width:34vw; max-width:250px; min-width:150px;
    height:78px;
    flex:0 0 auto;
  }
  .gesture-svg{ width:100%; height:100%; overflow:visible; display:block; }

  /* straight directional arrows pointing away from the centered hand */
  .gesture-arrow{
    fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
  }
  .gesture-arrow-left{
    stroke:var(--purple); opacity:.5;
    animation:arrowPulseLeft 2.6s ease-in-out infinite;
  }
  .gesture-arrow-right{
    stroke:var(--teal); opacity:.5;
    animation:arrowPulseRight 2.6s ease-in-out infinite;
  }
  @keyframes arrowPulseLeft{
    0%,100%{ opacity:.38; transform:translateX(0); }
    50%    { opacity:.9;  transform:translateX(-5px); }
  }
  @keyframes arrowPulseRight{
    0%,100%{ opacity:.38; transform:translateX(0); }
    50%    { opacity:.9;  transform:translateX(5px); }
  }

  /* ripple / droplet rings that expand outward from the centered hand */
  .ripple-ring{
    position:absolute; left:50%; top:50%;
    width:16px; height:16px; margin:-8px 0 0 -8px;
    border-radius:50%;
    border:1.4px solid transparent;
    opacity:0;
    pointer-events:none;
  }
  .ripple-a{ border-color:var(--purple-light); animation:rippleOut 2.8s cubic-bezier(.22,.7,.3,1) infinite; }
  .ripple-b{ border-color:var(--teal-light);   animation:rippleOut 2.8s cubic-bezier(.22,.7,.3,1) infinite; }
  .ripple-c{ border-color:var(--purple-light); animation:rippleOut 2.8s cubic-bezier(.22,.7,.3,1) infinite; }
  @keyframes rippleOut{
    0%   { transform:scale(.3); opacity:.6; }
    70%  { opacity:.12; }
    100% { transform:scale(3.6); opacity:0; }
  }

  /* the hand itself: centered, proper pointer/hand icon + fingertip touch indicator */
  .gesture-hand{
    position:absolute; width:34px; height:34px;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    animation:handIdlePulse 2.8s ease-in-out infinite;
    will-change:transform,opacity;
  }
  .hand-svg{ width:100%; height:100%; display:block; overflow:visible; }
  .hand-outline{
    stroke:var(--purple-deep); stroke-width:1.6; fill:none;
    opacity:.85;
  }
  .finger-tip{
    fill:var(--purple);
    opacity:.9;
    transform-box:fill-box; transform-origin:center;
    animation:fingerPress 2.8s ease-in-out infinite;
  }
  @keyframes fingerPress{
    0%,100% { transform:scale(1); }
    50%     { transform:scale(.62); }
  }
  @keyframes handIdlePulse{
    0%,100% { transform:translate(-50%,-50%) scale(1);    opacity:.85; }
    50%     { transform:translate(-50%,-50%) scale(1.08); opacity:1;   }
  }

  .fork-interactive.interacting .gesture-hand,
  .fork-interactive.interacting .gesture-arrow,
  .fork-interactive.interacting .ripple-ring{
    animation-play-state:paused;
    opacity:0;
  }
  .fork-interactive.interacting .finger-tip{
    animation-play-state:paused;
  }

  @media(prefers-reduced-motion:reduce){
    .gesture-hand,.ripple-ring,.finger-tip,
    .side-left,.side-right,.side-arrow{ animation:none; opacity:.85; }
    .gesture-arrow-left,.gesture-arrow-right{ animation:none; opacity:.5; }
  }
  @media(max-width:430px){
    /* Keep both directions fully inside the mobile viewport.
       The previous 36% + 30vw + 36% layout exceeded 100vw and
       pushed the PAUSE side off-screen on phones. */
    #fork{ padding-top:8vh; }
    .fork-top{ padding:0 6vw; }
    .fork-eyebrow{ font-size:.62rem; letter-spacing:.27em; }
    .fork-title{ font-size:clamp(1.5rem,6.8vw,2rem); }
    .fork-hint{ font-size:.68rem; }
    .fork-interactive{
      padding:0 4vw;
      gap:0;
      width:100%;
      overflow:visible;
    }
    .side{
      width:27%;
      min-width:0;
      flex:0 0 27%;
    }
    .fork-gesture{
      width:46%;
      min-width:0;
      max-width:none;
      height:70px;
      flex:0 0 46%;
    }
    .side-arrow{
      font-size:clamp(.62rem,3.2vw,.86rem);
      letter-spacing:.07em;
      white-space:nowrap;
    }
    .side-brand{
      font-size:clamp(.95rem,4.4vw,1.35rem);
      margin-top:.65em;
    }
    .side-tags{
      font-size:clamp(.52rem,2.25vw,.64rem);
      line-height:1.45;
      max-width:120px;
      margin-top:.5em;
    }
    .side-left .side-tags{ text-align:left; }
    .side-right .side-tags{ text-align:right; margin-left:auto; }
    .swipe-hint{ margin-bottom:3.2vh; }
  }

  /* elongating motion streak — used during a real, active drag */
  .gesture-streak{
    position:absolute; left:50%; top:50%;
    width:100%; height:2px;
    transform:translate(-50%,-50%) scaleX(0);
    border-radius:2px;
    opacity:0;
    pointer-events:none;
    will-change:transform,opacity;
  }
  .gesture-streak-left{
    background:linear-gradient(to left,rgba(110,79,201,.85),rgba(110,79,201,0));
    transform-origin:right center;
  }
  .gesture-streak-right{
    background:linear-gradient(to right,rgba(15,156,133,.85),rgba(15,156,133,0));
    transform-origin:left center;
  }
  .streak-head{
    position:absolute; top:50%; width:6px; height:6px; border-radius:50%;
    transform:translateY(-50%);
    box-shadow:0 0 10px 1px currentColor;
  }
  .gesture-streak-left .streak-head{ left:0; color:var(--purple); background:var(--purple); }
  .gesture-streak-right .streak-head{ right:0; color:var(--teal); background:var(--teal); }

  .swipe-hint{
    margin-top:1.4vh; margin-bottom:4vh;
    display:flex; flex-direction:column; align-items:center; gap:.6em;
    opacity:0;text-align:center;
    transition:opacity .3s ease;
  }
  .swipe-hint.show{animation:hintFade .8s ease forwards;}
  @keyframes hintFade{to{opacity:1;}}
  .swipe-dots{ display:flex; gap:.4em; }
  .swipe-dots span{
    width:4px; height:4px; border-radius:50%;
    background:var(--ink); opacity:.28;
  }
  .swipe-label{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
    color:#9a8fb4;
  }

  /* progress bar — appears only while actively dragging, fills toward commit threshold */
  .fork-progress{
    position:absolute; left:0; right:0; bottom:0; z-index:6;
    height:3px; background:rgba(27,23,48,.06);
    opacity:0;
    transition:opacity .25s ease;
  }
  .fork-progress.show{ opacity:1; }
  .fork-progress-fill{
    height:100%; width:0%;
    transform-origin:left center;
  }
  .fork-progress-fill.dir-left{
    background:linear-gradient(to right,var(--purple-light),var(--purple));
  }
  .fork-progress-fill.dir-right{
    margin-left:auto;
    background:linear-gradient(to left,var(--teal-light),var(--teal));
  }

  #tint-left,#tint-right{
    position:absolute;inset:0;opacity:0;pointer-events:none;
    transition:opacity .1s linear;
  }
  #tint-left{
    background:radial-gradient(circle at 0% 50%,rgba(110,79,201,.4),transparent 62%);
  }
  #tint-right{
    background:radial-gradient(circle at 100% 50%,rgba(15,156,133,.4),transparent 62%);
  }

  @media(max-width:430px){
    .brand-word{font-size:18vw;}
    .brand-sub{font-size:.58rem;letter-spacing:.2em;}
    #intro-tap{font-size:.6rem;}
  }

  @media(prefers-reduced-motion:reduce){
    #intro::before,.brand-word .half,.brand-sub,.brand-orbit,#intro-tap{
      animation:none;opacity:1;transform:none;
    }
  }

  /* 3. DESTINATION PANELS — full-bleed editorial reveal   */
  /* ---------------------------------------------------- */
  .site{
    position:absolute; top:0; bottom:0; width:100vw; height:100%;
    z-index:10;
    display:flex; flex-direction:column;
    transition: transform .62s cubic-bezier(.16,.9,.2,1);
    overflow:hidden;
  }
  #febfit-page, #site-fit{
    left:0; transform: translateX(100%);
    background:
      radial-gradient(120% 90% at 8% -10%, rgba(203,185,244,.35) 0%, transparent 55%),
      linear-gradient(155deg, var(--purple) 0%, var(--purple-deep) 78%);
  }
  #mindfulness-page, #site-mind{
    left:0; transform: translateX(-100%);
    background:
      radial-gradient(120% 90% at 8% -10%, rgba(183,236,225,.35) 0%, transparent 55%),
      linear-gradient(155deg, var(--teal) 0%, var(--teal-deep) 78%);
  }
  #febfit-page.active, #mindfulness-page.active, #site-fit.active, #site-mind.active{ transform: translateX(0); }

  /* --- decorative layer: concentric rings + leaf, sit behind the figure --- */
  .site-decor{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .deco-rings{
    position:absolute; right:-14vw; top:50%; transform:translateY(-50%);
    width:78vw; height:78vw; max-width:640px; max-height:640px;
  }
  .deco-rings circle{ fill:none; stroke:rgba(255,255,255,.14); }
  .deco-leaf{
    position:absolute; left:6%; bottom:-4%;
    width:34vw; max-width:220px; opacity:.16;
  }
  #site-fit .deco-leaf{ fill:var(--purple-light); }
  #site-mind .deco-leaf{ fill:var(--teal-light); }

  /* --- figure illustration, bleeding off the right edge --- */
  .site-figure{
    position:absolute; z-index:2;
    right:-8vw; bottom:0;
    width:62vw; max-width:420px;
    height:78vh; max-height:640px;
    display:flex; align-items:flex-end; justify-content:center;
    filter:drop-shadow(0 22px 40px rgba(0,0,0,.28));
  }
  .site-figure svg{ width:100%; height:100%; }

  .site-nav{
    position:relative; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 22px 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .site-logo{
    font-size:.92rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:#fff;
  }
  #site-mind .site-logo{ font-weight:600; }

  .hamburger-btn{
    display:flex; flex-direction:column; gap:5px; align-items:flex-end;
    border:none; background:none; padding:8px; cursor:pointer;
  }
  .hamburger-btn span{
    display:block; height:2px; background:#fff; border-radius:2px;
  }
  .hamburger-btn span:nth-child(1){ width:20px; }
  .hamburger-btn span:nth-child(2){ width:20px; }
  .hamburger-btn span:nth-child(3){ width:12px; }

  .site-menu{
    position:absolute; z-index:8; top:60px; right:20px;
    display:flex; flex-direction:column; gap:2px;
    background:rgba(255,255,255,.97);
    border-radius:14px;
    padding:8px;
    box-shadow:0 20px 40px -12px rgba(0,0,0,.4);
    opacity:0; visibility:hidden; transform:translateY(-6px);
    transition: opacity .22s ease, transform .22s ease, visibility .22s;
  }
  .site-menu.open{ opacity:1; visibility:visible; transform:translateY(0); }
  .site-menu button{
    border:none; background:none; text-align:left;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:.78rem; letter-spacing:.02em; color:var(--ink);
    padding:11px 14px; border-radius:9px; cursor:pointer;
  }
  .site-menu button:active{ background:rgba(0,0,0,.05); }

  .site-hero{
    position:relative; z-index:4;
    flex:1; display:flex; flex-direction:column;
    justify-content:center; text-align:left;
    padding: 4vh 10vw 12vh 8vw;
    max-width:66%;
  }
  .site-headline{
    font-size:clamp(2.1rem,9.6vw,2.9rem); line-height:1.04; font-weight:600;
    letter-spacing:-.01em; color:#fff; text-transform:uppercase;
  }
  .site-sub{
    margin-top:1.1em;
    font-size:1rem; line-height:1.55; font-weight:400; font-style:italic;
    color:rgba(255,255,255,.82);
  }

  .site-cta{
    margin-top: 2.1em; align-self:flex-start;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight:600; font-size:clamp(.72rem,3.2vw,.8rem); letter-spacing:.04em; text-transform:uppercase;
    padding: 15px 24px; border-radius:999px; border:none;
    box-shadow: 0 16px 30px -14px rgba(0,0,0,.5);
    color:#fff; line-height:1.3;
  }
  #site-fit .site-cta{ background: var(--purple-deep); }
  #site-mind .site-cta{ background: var(--teal-deep); }

  .site-indicator{
    position:absolute; z-index:5; left:0; right:0; bottom:4vh;
    display:flex; justify-content:center;
  }
  .site-indicator .dot{
    width:6px; height:6px; border-radius:50%;
    background:rgba(255,255,255,.85);
    box-shadow:0 0 0 5px rgba(255,255,255,.14);
  }

  #site-fit .fit-hero-shell{
    position:absolute; inset:0; z-index:4; display:flex; flex-direction:column;
    background:linear-gradient(120deg, rgba(124,89,173,.12), rgba(255,255,255,0));
  }
  #site-fit .fit-header{
    position:relative; z-index:5; display:flex; align-items:center; justify-content:space-between;
    padding:22px 28px 0;
  }
  #site-fit .fit-brand{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-size:2rem; font-weight:800;
    letter-spacing:.05em; color:#fff; text-transform:uppercase; line-height:1;
  }
  #site-fit .fit-menu{
    width:42px; height:32px; display:flex; flex-direction:column; justify-content:center; align-items:flex-end;
    gap:6px; padding:0; cursor:pointer; background:none; border:none;
  }
  #site-fit .fit-menu span{
    display:block; height:2px; width:24px; border-radius:2px; background:#fff;
  }
  #site-fit .fit-menu span:nth-child(3){ width:18px; }

  #site-fit .fit-main{
    position:relative; z-index:4; display:grid; grid-template-columns:1.05fr .95fr; align-items:center;
    flex:1; padding:0 0 4vh 0;
  }
  #site-fit .fit-copy{
    padding:8vh 0 0 7vw; max-width:46vw;
  }
  #site-fit .fit-headline{
    margin:0; font-size:clamp(3.2rem,6.8vw,8rem); line-height:0.85; letter-spacing:-.055em;
    color:#fff; font-weight:600; text-transform:uppercase; font-family:'Fraunces','Iowan Old Style',Georgia,serif;
    font-style:normal; text-shadow:0 2px 18px rgba(0,0,0,.12);
  }
  #site-fit .fit-headline .line{ display:block; }
  #site-fit .fit-sub{
    margin-top:1.5rem; color:rgba(255,255,255,.9); font-size:1.1rem; line-height:1.5; font-style:italic;
    font-weight:400; font-family:'Fraunces','Iowan Old Style',Georgia,serif;
  }
  #site-fit .fit-sub strong{ font-weight:600; }
  #site-fit .fit-cta-wrap{ margin-top:2.2rem; }
  #site-fit .fit-cta{
    display:inline-flex; align-items:center; justify-content:center; gap:10px; min-width:230px;
    padding:16px 26px; border-radius:18px; border:1px solid rgba(255,255,255,.12);
    background:rgba(35,20,60,.38); color:#fff; font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    font-weight:700; font-size:1.05rem; letter-spacing:.06em; text-transform:uppercase;
    box-shadow:0 16px 30px -14px rgba(23,12,38,.75);
  }
  #site-fit .fit-cta::after{ content:'→'; font-size:1.3rem; }

  #site-fit .fit-art-wrap{
    position:relative; min-height:62vh; display:flex; align-items:center; justify-content:center;
    padding-right:4vw;
  }
  #site-fit .fit-rings{
    position:absolute; right:-8vw; top:50%; transform:translateY(-50%); width:80vw; height:80vw;
    max-width:760px; max-height:760px; border-radius:50%;

  <!-- 3a. FITNESS SITE -->
  <div class="site" id="site-fit">
    <button class="site-back" type="button" onclick="window.goToFork()">Back</button>
    <iframe class="site-embed" src="index-updated-logo-nav-2.html" title="Febfit Wellness"></iframe>
  </div>

  <!-- 3b. MIND WELLNESS SITE -->
  <div class="site" id="site-mind">
    <button class="site-back" type="button" onclick="window.goToFork()">Back</button>
    <iframe class="site-embed" src="febmindfulness-1.html" title="Febmindfulness"></iframe>
  </div>

</div>

</div>
<script>
(function(){
  var fork=document.getElementById('swipe-screen') || document.getElementById('fork');
  var tintL=document.getElementById('tint-left');
  var tintR=document.getElementById('tint-right');
  var siteFit=document.getElementById('febfit-page') || document.getElementById('site-fit');
  var siteMind=document.getElementById('mindfulness-page') || document.getElementById('site-mind');

  var dragZone=document.getElementById('fork-interactive');
  var sideLeft=document.getElementById('side-left');
  var sideRight=document.getElementById('side-right');
  var arrowLeft=sideLeft.querySelector('.side-arrow');
  var arrowRight=sideRight.querySelector('.side-arrow');
  var forkTop=document.querySelector('.fork-top');
  var forkTitle=document.querySelector('.fork-title');
  var hint=document.getElementById('swipe-hint');
  var progressWrap=document.getElementById('fork-progress');
  var progressFill=document.getElementById('fork-progress-fill');
  var streakLeft=document.getElementById('streak-left');
  var streakRight=document.getElementById('streak-right');

  var state='fork';
  var THRESHOLD_FRACTION=.27;    // commit swipe at ~27% of screen width
  var VISUAL_RANGE_FRACTION=.4;  // visuals reach full strength around 40% width
  // Start directly on the swipe-choice page; the intro screen has been removed.
  fork.classList.add("show");
  window.goToFork = window.goToFork || function(){
    closeMenus();
    state='fork';
    fork.classList.add('show');
    siteFit.classList.remove('active');
    siteMind.classList.remove('active');
    resetForkVisuals();
    hint.classList.remove('show');
  };
  setTimeout(function(){ window.goToFork(); }, 10);

  function showHint(){
    if(state!=='fork') return;
    hint.classList.add('show');
  }

  function resetTint(){tintL.style.opacity=0;tintR.style.opacity=0;}

  function goToFitness(){
    closeMenus();
    if(state==='site-fit') return;
    state='site-fit';
    siteFit.classList.add('active');
    siteMind.classList.remove('active');
    fork.classList.remove('show');
  }

  function goToMindfulness(){
    closeMenus();
    if(state==='site-mind') return;
    state='site-mind';
    siteMind.classList.add('active');
    siteFit.classList.remove('active');
    fork.classList.remove('show');
  }

  window.goToFitness=goToFitness;
  window.goToMindfulness=goToMindfulness;

  window.goToFork=function(){
    closeMenus();
    state='fork';
    fork.classList.add('show');
    siteFit.classList.remove('active');
    siteMind.classList.remove('active');
    resetForkVisuals();
    hint.classList.remove('show');
    setTimeout(showHint,900);
  };

  // --- hamburger menus on the destination pages ---
  var menuPanels=[document.getElementById('menu-panel-fit'),document.getElementById('menu-panel-mind')];
  var menuBtnFit=document.getElementById('menu-btn-fit');
  var menuBtnMind=document.getElementById('menu-btn-mind');

  window.closeMenus=function(){
    menuPanels.forEach(function(m){ if(m) m.classList.remove('open'); });
  };

  function toggleMenu(panel){
    var isOpen=panel.classList.contains('open');
    closeMenus();
    if(!isOpen) panel.classList.add('open');
  }

  if(menuBtnFit) menuBtnFit.addEventListener('click',function(e){
    e.stopPropagation();
    toggleMenu(document.getElementById('menu-panel-fit'));
  });
  if(menuBtnMind) menuBtnMind.addEventListener('click',function(e){
    e.stopPropagation();
    toggleMenu(document.getElementById('menu-panel-mind'));
  });
  document.addEventListener('click',function(e){
    if(!e.target.closest('.site-menu') && !e.target.closest('.hamburger-btn')) closeMenus();
  });

  var dragging=false,pointerId=null;
  var curX=0,startX=0;

  // Drives every reactive layer (sides, tint, background) from a single
  // horizontal offset — the interaction itself is the visual, no card involved.
  function applyVisual(dx){
    var range=window.innerWidth*VISUAL_RANGE_FRACTION;
    var p=Math.min(Math.abs(dx)/range,1);
    var tintP=Math.min(Math.abs(dx)/(window.innerWidth*THRESHOLD_FRACTION),1);
    var follow=dx*.14;

    dragZone.style.transform='translate3d('+follow+'px,0,0)';

    // heading skews a few degrees, as if being dragged along with the gesture
    var skewDeg=Math.max(-4,Math.min(4,dx*.012));
    forkTitle.style.transform='rotate('+skewDeg+'deg)';

    // progress bar toward the commit threshold
    progressWrap.classList.add('show');
    progressFill.style.width=(tintP*100)+'%';
    progressFill.className='fork-progress-fill '+(dx<0?'dir-left':'dir-right');

    if(dx<0){
      sideLeft.style.transform='translate3d('+(dx*.1)+'px,0,0) scale('+(1+p*.06)+')';
      sideLeft.style.opacity=1;
      arrowLeft.style.transform='scale('+(1+tintP*.16)+')';
      sideRight.style.transform='translate3d('+(p*14)+'px,'+(p*10)+'px,0) scale('+(1-p*.22)+')';
      sideRight.style.opacity=1-p*.7;
      arrowRight.style.transform='';
      tintL.style.opacity=tintP*.95;
      tintR.style.opacity=0;
      streakLeft.style.opacity=p;
      streakLeft.style.transform='translate(-50%,-50%) scaleX('+p+')';
      streakRight.style.opacity=0;
      streakRight.style.transform='translate(-50%,-50%) scaleX(0)';
    }else if(dx>0){
      sideRight.style.transform='translate3d('+(dx*.1)+'px,0,0) scale('+(1+p*.06)+')';
      sideRight.style.opacity=1;
      arrowRight.style.transform='scale('+(1+tintP*.16)+')';
      sideLeft.style.transform='translate3d('+(-p*14)+'px,'+(p*10)+'px,0) scale('+(1-p*.22)+')';
      sideLeft.style.opacity=1-p*.7;
      arrowLeft.style.transform='';
      tintR.style.opacity=tintP*.95;
      tintL.style.opacity=0;
      streakRight.style.opacity=p;
      streakRight.style.transform='translate(-50%,-50%) scaleX('+p+')';
      streakLeft.style.opacity=0;
      streakLeft.style.transform='translate(-50%,-50%) scaleX(0)';
    }else{
      resetForkVisuals();
    }
  }

  function resetForkVisuals(){
    dragZone.style.transform='';
    sideLeft.style.transform='';sideLeft.style.opacity='';
    sideRight.style.transform='';sideRight.style.opacity='';
    arrowLeft.style.transform='';arrowRight.style.transform='';
    forkTop.style.opacity='';
    forkTitle.style.transform='';
    progressWrap.classList.remove('show');
    progressFill.style.width='0%';
    streakLeft.style.opacity=0;streakLeft.style.transform='translate(-50%,-50%) scaleX(0)';
    streakRight.style.opacity=0;streakRight.style.transform='translate(-50%,-50%) scaleX(0)';
    resetTint();
  }

  function getPointerClientX(e){
    if(typeof e.clientX==='number') return e.clientX;
    if(e.touches && e.touches[0]) return e.touches[0].clientX;
    if(e.changedTouches && e.changedTouches[0]) return e.changedTouches[0].clientX;
    return startX;
  }

  function onPointerDown(e){
    if(state!=='fork') return;
    if(e.target && e.target.closest && e.target.closest('.fork-cta, .fork-menu, .site-back')) return;
    dragging=true;
    pointerId = (typeof e.pointerId === 'number') ? e.pointerId : 'touch';
    if (fork.setPointerCapture && typeof e.pointerId === 'number') {
      try { fork.setPointerCapture(pointerId); } catch (err) {}
    }
    dragZone.classList.add('interacting','grabbing');
    fork.classList.add('grabbing');
    dragZone.style.transition='none';
    startX=getPointerClientX(e);curX=0;
  }

  function onPointerMove(e){
    if(!dragging) return;
    var evtPointerId = (typeof e.pointerId === 'number') ? e.pointerId : pointerId;
    if (typeof e.pointerId === 'number' && evtPointerId !== pointerId) return;
    curX=getPointerClientX(e)-startX;
    applyVisual(curX);
  }

  function onPointerUp(e){
    if(!dragging) return;
    var evtPointerId = (typeof e.pointerId === 'number') ? e.pointerId : pointerId;
    if (typeof e.pointerId === 'number' && evtPointerId !== pointerId) return;
    dragging=false;
    dragZone.classList.remove('grabbing');
    fork.classList.remove('grabbing');
    if (fork.releasePointerCapture && typeof e.pointerId === 'number') {
      try { fork.releasePointerCapture(pointerId); } catch (err) {}
    }

    var threshPx=window.innerWidth*THRESHOLD_FRACTION;
    if(curX<=-threshPx) completeSwipe(-1);
    else if(curX>=threshPx) completeSwipe(1);
    else springBack();
  }

  function completeSwipe(direction){
    dragZone.style.transition='transform .55s cubic-bezier(.2,.8,.2,1)';
    sideLeft.style.transition='transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s ease';
    sideRight.style.transition='transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s ease';
    tintL.style.transition='opacity .5s ease';
    tintR.style.transition='opacity .5s ease';
    forkTop.style.transition='opacity .35s ease';
    progressFill.style.transition='width .4s ease';
    streakLeft.style.transition='opacity .35s ease';
    streakRight.style.transition='opacity .35s ease';

    var exitX=direction*window.innerWidth*.6;
    dragZone.style.transform='translate3d('+exitX+'px,0,0)';
    forkTop.style.opacity=0;
    hint.classList.remove('show');

    // progress completes to 100% and the tint expands to fill the screen
    // just before the destination page swaps in
    progressFill.className='fork-progress-fill '+(direction<0?'dir-left':'dir-right');
    progressFill.style.width='100%';
    streakLeft.style.opacity=0;
    streakRight.style.opacity=0;

    if(direction<0){
      tintL.style.opacity=1; tintR.style.opacity=0;
      sideLeft.style.opacity=1; sideRight.style.opacity=0;
    }else{
      tintR.style.opacity=1; tintL.style.opacity=0;
      sideRight.style.opacity=1; sideLeft.style.opacity=0;
    }

    setTimeout(function(){
      if(direction<0) goToFitness(); else goToMindfulness();
      fork.classList.remove('show');
      hardResetFork();
    },480);
  }

  function springBack(){
    dragZone.classList.remove('interacting');
    fork.classList.remove('grabbing');
    dragZone.style.transition='transform .5s cubic-bezier(.2,.9,.25,1)';
    sideLeft.style.transition='transform .5s cubic-bezier(.2,.9,.25,1),opacity .4s ease';
    sideRight.style.transition='transform .5s cubic-bezier(.2,.9,.25,1),opacity .4s ease';
    tintL.style.transition='opacity .4s ease';
    tintR.style.transition='opacity .4s ease';
    forkTitle.style.transition='transform .5s cubic-bezier(.2,.9,.25,1)';
    progressFill.style.transition='width .4s ease';
    progressWrap.style.transition='opacity .3s ease';
    streakLeft.style.transition='opacity .3s ease,transform .3s ease';
    streakRight.style.transition='opacity .3s ease,transform .3s ease';
    resetForkVisuals();
    curX=0;
  }

  function hardResetFork(){
    dragZone.classList.remove('interacting','grabbing');
    fork.classList.remove('grabbing');
    dragZone.style.transition='none';
    sideLeft.style.transition='none';sideRight.style.transition='none';
    tintL.style.transition='none';tintR.style.transition='none';
    forkTop.style.transition='none';
    forkTitle.style.transition='none';
    progressFill.style.transition='none';
    progressWrap.style.transition='none';
    streakLeft.style.transition='none';streakRight.style.transition='none';
    curX=0;
    resetForkVisuals();
    void dragZone.offsetWidth;
    dragZone.style.transition='';
    sideLeft.style.transition='';sideRight.style.transition='';
    tintL.style.transition='';tintR.style.transition='';
    forkTop.style.transition='';
    forkTitle.style.transition='';
    progressFill.style.transition='';
    progressWrap.style.transition='';
    streakLeft.style.transition='';streakRight.style.transition='';
  }

  var forkCta=document.querySelector('.fork-cta');
  if(forkCta){
    forkCta.addEventListener('click',function(e){
      e.preventDefault();
      e.stopPropagation();
      goToFitness();
    });
  }

  fork.addEventListener('pointerdown',onPointerDown);
  fork.addEventListener('mousedown',onPointerDown);
  fork.addEventListener('touchstart',onPointerDown,{passive:true});

  window.addEventListener('pointermove',onPointerMove);
  window.addEventListener('mousemove',onPointerMove);
  window.addEventListener('touchmove',onPointerMove,{passive:false});

  window.addEventListener('pointerup',onPointerUp);
  window.addEventListener('mouseup',onPointerUp);
  window.addEventListener('touchend',onPointerUp,{passive:true});
  window.addEventListener('pointercancel',onPointerUp);
  window.addEventListener('touchcancel',onPointerUp,{passive:true});

  window.addEventListener('keydown',function(e){
    if(state==='fork'){
      if(e.key==='ArrowLeft') completeSwipe(-1);
      if(e.key==='ArrowRight') completeSwipe(1);
    }else{
      if(e.key==='Escape'||e.key==='Backspace') window.goToFork();
    }
  });
})();
</script>
</body>
</html>
