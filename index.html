<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FebFit Wellness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
  #stage{position:fixed;inset:0}
  .site{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;background:#fff}
  .site.active{opacity:1;visibility:visible;pointer-events:auto}
  .site-frame,.site-embed-wrap{position:absolute;inset:0}
  .site-embed{width:100%;height:100%;border:0;display:block}
  .path-toggle{position:fixed;z-index:20;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:rgba(255,255,255,.97);border:1px solid rgba(61,42,109,.24);border-radius:100px;box-shadow:0 12px 35px rgba(30,18,50,.22)}
  .path-toggle button{border:0;background:transparent;color:#3d2a6d;padding:11px 20px;border-radius:100px;font:700 14px Manrope,Arial,sans-serif;cursor:pointer;min-width:118px}
  .path-toggle button.active{background:#6e4fc9;color:#fff}
  .path-toggle button:focus-visible{outline:3px solid #0f9c85;outline-offset:2px}
  @media(max-width:480px){.path-toggle{bottom:calc(9px + env(safe-area-inset-bottom,0px))}.path-toggle button{min-width:100px;padding:10px 14px}}
</style>
</head>
<body>
<div id="stage">
  <div class="site active" id="site-fit" aria-label="Fitness page">
    <div class="site-frame"><div class="site-embed-wrap"><iframe class="site-embed" src="febfit.html" title="FebFit fitness"></iframe></div></div>
  </div>
  <div class="site" id="site-mind" aria-label="Mindfulness page" aria-hidden="true">
    <div class="site-frame"><div class="site-embed-wrap"><iframe class="site-embed" src="febmindfulness-1.html" title="FebFit mindfulness" loading="lazy"></iframe></div></div>
  </div>
</div>
<nav class="path-toggle" aria-label="Choose your FebFit focus">
  <button type="button" id="chooseFit" class="active" aria-pressed="true">Fitness</button>
  <button type="button" id="chooseMind" aria-pressed="false">Mindfulness</button>
</nav>
<script>
(function(){
  var fit=document.getElementById('site-fit'), mind=document.getElementById('site-mind');
  var fitBtn=document.getElementById('chooseFit'), mindBtn=document.getElementById('chooseMind');
  function switchProgram(program,anchor){
    var isMind=program==='mindfulness';
    fit.classList.toggle('active',!isMind); mind.classList.toggle('active',isMind);
    fit.setAttribute('aria-hidden',String(isMind)); mind.setAttribute('aria-hidden',String(!isMind));
    fitBtn.classList.toggle('active',!isMind); mindBtn.classList.toggle('active',isMind);
    fitBtn.setAttribute('aria-pressed',String(!isMind)); mindBtn.setAttribute('aria-pressed',String(isMind));
    history.replaceState(null,'',anchor?'#'+anchor:'#'+(isMind?'mindfulness':'fitness'));
    if(anchor){
      var frame=(isMind?mind:fit).querySelector('iframe');
      function jump(){try{frame.contentDocument.getElementById(anchor)?.scrollIntoView({behavior:'smooth'});}catch(e){}}
      if(frame.contentDocument?.readyState==='complete') jump(); else frame.addEventListener('load',jump,{once:true});
    }
  }
  window.switchProgram=switchProgram;
  window.goToFitness=function(){switchProgram('fitness')};
  window.goToMindfulness=function(){switchProgram('mindfulness')};
  fitBtn.addEventListener('click',function(){switchProgram('fitness')});
  mindBtn.addEventListener('click',function(){switchProgram('mindfulness')});
  if(location.hash==='#mindfulness') switchProgram('mindfulness');
  if(location.hash==='#contact') switchProgram('fitness','contact');
  window.addEventListener('hashchange',function(){
    if(location.hash==='#mindfulness') switchProgram('mindfulness');
    else if(location.hash==='#fitness') switchProgram('fitness');
    else if(location.hash==='#contact') switchProgram('fitness','contact');
  });
})();
</script>
</body>
</html>
